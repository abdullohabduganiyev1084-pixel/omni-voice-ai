publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  provider: ^6.1.1
  http: ^1.2.0
  speech_to_text: ^6.6.1
  flutter_tts: ^3.8.5
  permission_handler: ^11.3.0
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
